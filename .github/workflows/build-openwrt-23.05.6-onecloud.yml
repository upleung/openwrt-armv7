name: Build OpenWrt ARMv7 with LuCI 23.05.6

on:
  workflow_dispatch: # 仅保留手动触发

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v23.05.6 # 指定23.05.6稳定版

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: 克隆 OpenWrt 源码
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 更新及安装 feeds (官方原生环境)
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 生成带有 LuCI 的 .config 配置文件
      run: |
        cd openwrt
        # 匹配玩客云 (OneCloud) 专属架构: Amlogic -> meson8b -> thunder-onecloud
        cat >> .config <<EOF
        CONFIG_TARGET_amlogic=y
        CONFIG_TARGET_amlogic_meson8b=y
        CONFIG_TARGET_amlogic_meson8b_DEVICE_thunder-onecloud=y
        CONFIG_TARGET_ROOTFS_TARGZ=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF
        make defconfig

    - name: 下载依赖包
      run: |
        cd openwrt
        make download -j8

    - name: 编译 OpenWrt 固件
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: 准备 Docker 镜像上下文
      run: |
        set -euo pipefail
        # 自动查找 openwrt/bin/targets/amlogic/meson8b/ 下生成的 rootfs.tar.gz
        ROOTFS="$(find openwrt/bin/targets -type f -name '*rootfs.tar.gz' | sort | head -n 1)"
        test -n "$ROOTFS"
        cp "$ROOTFS" ./rootfs.tar.gz
        cat > Dockerfile <<'EOF'
        FROM scratch
        ADD rootfs.tar.gz /
        USER root
        CMD ["/sbin/init"]
        EOF

    - name: 配置 QEMU 跨平台构建支持
      uses: docker/setup-qemu-action@v3

    - name: 配置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 登录 GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送到 Docker Hub & GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm/v7
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/openwrt-armv7:onecloud
          ghcr.io/${{ github.repository_owner }}/openwrt-armv7:onecloud

    - name: 上传 Rootfs 供原生 Linux 使用
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-onecloud-rootfs
        path: rootfs.tar.gz
