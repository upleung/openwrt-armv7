name: Build OpenWrt ARMv7 with LuCI 23.05.6-new

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v23.05.6

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: 克隆 OpenWrt 源码
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 更新及安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 生成带有 LuCI 的 .config 配置文件
      run: |
        cd openwrt
        cat >> .config <<EOF
        CONFIG_TARGET_armsr=y
        CONFIG_TARGET_armsr_armv7=y
        CONFIG_TARGET_armsr_armv7_Default=y
        CONFIG_TARGET_ROOTFS_TARGZ=y
        CONFIG_TARGET_ROOTFS_EXT4FS=n
        CONFIG_TARGET_ROOTFS_SQUASHFS=n

        # 【核心修复】显式取消选中基础版 dnsmasq，防止与 dnsmasq-full 冲突
        # CONFIG_PACKAGE_dnsmasq is not set
        CONFIG_PACKAGE_dnsmasq-full=y

        # 系统基础组件与依赖
        CONFIG_PACKAGE_busybox=y
        CONFIG_PACKAGE_ubus=y
        CONFIG_PACKAGE_uci=y
        CONFIG_PACKAGE_rpcd=y
        CONFIG_PACKAGE_netifd=y
        CONFIG_PACKAGE_procd=y
        CONFIG_PACKAGE_fstools=y

        # 网络组件
        CONFIG_PACKAGE_odhcpd-ipv6only=y
        CONFIG_PACKAGE_ppp=y
        CONFIG_PACKAGE_ppp-mod-pppoe=y
        CONFIG_PACKAGE_iptables=y
        CONFIG_PACKAGE_nftables=y
        CONFIG_PACKAGE_ip-full=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget=y
        CONFIG_PACKAGE_ca-certificates=y

        # LUCI 界面与插件
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-proto-ipv6=y
        CONFIG_PACKAGE_luci-proto-pppoe=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-opkg=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF
        make defconfig

    - name: 下载依赖包
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译 OpenWrt 固件
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: 准备 Docker 镜像上下文
      run: |
        set -euo pipefail
        ROOTFS="$(find openwrt/bin/targets -type f -name '*rootfs.tar.gz' | sort | head -n 1)"
        test -n "$ROOTFS"
        cp "$ROOTFS" ./rootfs.tar.gz
        cat > Dockerfile <<'EOF'
        FROM scratch
        ADD rootfs.tar.gz /
        USER root
        CMD ["/sbin/init"]
        EOF

    - name: 配置 QEMU 跨平台构建支持
      uses: docker/setup-qemu-action@v3

    - name: 配置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 登录 GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送到 Docker Hub & GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm/v7
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/openwrt-armv7:v23.05.6
          ghcr.io/${{ github.repository_owner }}/openwrt-armv7:v23.05.6

    - name: 上传 Rootfs 供原生 Linux 使用
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-armv7-luci-rootfs
        path: rootfs.tar.gz
