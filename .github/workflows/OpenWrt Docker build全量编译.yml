name: Manual Build OpenWrt ARMv7 Source

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: '输入要编译的 OpenWrt 版本号 (例如: v23.05.6)'
        required: true
        default: 'v23.05.6'

env:
  REPO_URL: https://github.com/openwrt/openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: 克隆 OpenWrt 源码
      run: |
        # 动态使用输入的版本号
        git clone --depth 1 $REPO_URL -b ${{ github.event.inputs.openwrt_version }} openwrt

    - name: 更新及安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 生成 .config 配置文件
      run: |
        cd openwrt
        cat >> .config <<EOF
        CONFIG_TARGET_armsr=y
        CONFIG_TARGET_armsr_armv7=y
        CONFIG_TARGET_armsr_armv7_Default=y
        CONFIG_TARGET_ROOTFS_TARGZ=y
        CONFIG_TARGET_ROOTFS_EXT4FS=n
        CONFIG_TARGET_ROOTFS_SQUASHFS=n
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF
        make defconfig

    - name: 下载依赖包 & 编译固件
      run: |
        cd openwrt
        make download -j8
        make -j$(nproc) || make -j1 V=s

    - name: 准备 Docker 镜像上下文
      run: |
        set -euo pipefail
        ROOTFS="$(find openwrt/bin/targets -type f -name '*rootfs.tar.gz' | sort | head -n 1)"
        test -n "$ROOTFS"
        cp "$ROOTFS" ./rootfs.tar.gz
        cat > Dockerfile <<'EOF'
        FROM scratch
        ADD rootfs.tar.gz /
        USER root
        CMD ["/sbin/init"]
        EOF

    - name: 配置跨平台与 Buildx
      uses: docker/setup-qemu-action@v3
    - name: 配置 Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: 登录 GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送到 Docker Hub & GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm/v7
        push: true
        # 动态打上用户输入的版本号标签 (去除 v 前缀方便统一)
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/openwrt-armv7:${{ github.event.inputs.openwrt_version }}
          ghcr.io/${{ github.repository_owner }}/openwrt-armv7:${{ github.event.inputs.openwrt_version }}

    - name: 上传 Rootfs 供原生 Linux 使用
      uses: actions/upload-artifact@v4
      with:
        # 使用输入的版本号拼接动态名称，避免硬编码
        name: openwrt-armv7-rootfs-${{ github.event.inputs.openwrt_version }}
        path: rootfs.tar.gz
        # 设置产物保留天数（默认 90 天，可按需修改）
        retention-days: 30
