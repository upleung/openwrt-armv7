name: Build OpenWrt ARMv7 with LuCI 24.10.0

on:
  workflow_dispatch: # 仅保留手动触发

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v24.10.0 # 指定24.10稳定版

jobs:
  build:
    runs-on: ubuntu-22.04
    # 【新增】必须配置权限，允许 GITHUB_TOKEN 写入镜像包
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 【修改这里】去掉了 /etc/apt/sources.list.d/*，防止误删软件源
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: 克隆 OpenWrt 源码
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: 更新及安装 feeds (官方原生环境)
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 生成带有 LuCI 的 .config 配置文件
      run: |
        cd openwrt
        # 配置 ARMv7 容器目标，并显式加入 LuCI 界面与中文包
        cat >> .config <<EOF
        CONFIG_TARGET_armsr=y
        CONFIG_TARGET_armsr_armv7=y
        CONFIG_TARGET_armsr_armv7_Default=y
        CONFIG_TARGET_ROOTFS_TARGZ=y
        CONFIG_TARGET_ROOTFS_EXT4FS=n
        CONFIG_TARGET_ROOTFS_SQUASHFS=n
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF
        make defconfig

    - name: 下载依赖包
      run: |
        cd openwrt
        make download -j8

    - name: 编译 OpenWrt 固件
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: 准备 Docker 镜像上下文
      run: |
        set -euo pipefail
        # 不再硬编码 armvirt/32，自动找真正生成的 rootfs.tar.gz
        ROOTFS="$(find openwrt/bin/targets -type f -name '*rootfs.tar.gz' | sort | head -n 1)"
        test -n "$ROOTFS"
        cp "$ROOTFS" ./rootfs.tar.gz
        cat > Dockerfile <<'EOF'
        FROM scratch
        ADD rootfs.tar.gz /
        USER root
        CMD ["/sbin/init"]
        EOF

    - name: 配置 QEMU 跨平台构建支持
      uses: docker/setup-qemu-action@v3

    - name: 配置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 登录 GitHub Container Registry (GHCR)
      # 【新增】你提供的 GHCR 登录代码
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送到 Docker Hub & GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm/v7
        push: true
        # 【修改】在这里加入两行 tag，分别对应 Docker Hub 和 GHCR
        # 注意：此处假定 github.repository_owner 是全小写字母
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/openwrt-armv7-24.10.0:latest
          ghcr.io/${{ github.repository_owner }}/openwrt-armv7-24.10.0:latest

    - name: 上传 Rootfs 供原生 Linux 使用
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-armv7-luci-rootfs-24.10.0
        path: rootfs.tar.gz
