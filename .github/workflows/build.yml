name: Build OpenWrt ARMv7 with Image Builder

on:
  workflow_dispatch: # 保持手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    # 必须配置权限，允许 GITHUB_TOKEN 写入 GHCR 镜像包
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 准备基础打包环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Image Builder 只需要非常基础的工具，无需全量编译依赖
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3
        sudo apt-get -qq clean

    - name: 下载并解压 OpenWrt Image Builder (24.10.0)
      run: |
        VERSION="24.10.0"
        TARGET="armsr"
        SUBTARGET="armv7"
        # 【注意】这里文件名中间不要有空格
        URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}/openwrt-imagebuilder-${VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.xz"
        
        echo "正在下载 Image Builder..."
        wget -q $URL
        tar -xJf openwrt-imagebuilder-${VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.xz
        mv openwrt-imagebuilder-${VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64 imagebuilder

    - name: 使用 Image Builder 极速打包固件
      run: |
        cd imagebuilder
        # PROFILE="default" 对应 armvirt 架构的默认配置
        # PACKAGES 参数填入你需要额外追加的包（底层基础网络包会自动包含，无需填写）
        make image PROFILE="default" PACKAGES="luci luci-i18n-base-zh-cn"

    - name: 提取 Rootfs 压缩包并生成 Dockerfile
      run: |
        cd imagebuilder/bin/targets/armvirt/32
        # 匹配生成的 rootfs.tar.gz
        tarball=$(ls *rootfs.tar.gz | head -n 1)
        cp $tarball ../../../../../rootfs.tar.gz
        cd ../../../../../
        
        # 制作极致纯净 Dockerfile
        cat >> Dockerfile <<EOF
        FROM scratch
        ADD rootfs.tar.gz /
        EXPOSE 22 80 443
        USER root
        CMD ["/sbin/init"]
        EOF

    - name: 配置 QEMU 跨平台构建支持
      uses: docker/setup-qemu-action@v3

    - name: 配置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 登录 GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送到 Docker Hub & GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm/v7
        push: true
        # 推送双端标签
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/openwrt-armv7:latest
          ghcr.io/${{ github.repository_owner }}/openwrt-armv7:latest

    - name: 上传 Rootfs 供原生 Linux (Nspawn/Chroot) 使用
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-armv7-luci-rootfs
        path: rootfs.tar.gz
