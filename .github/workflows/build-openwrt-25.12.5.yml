name: Build OpenWrt ARMv7 with LuCI 25.12.5

on:
  workflow_dispatch:

env:
  VERSION: 25.12.5
  TARGET: armsr
  SUBTARGET: armv7

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repo (upleung/openwrt-armv7)
      uses: actions/checkout@v4

    - name: 初始化构建环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y wget ca-certificates
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: 下载官方 OpenWrt ARMv7 Rootfs + 校验
      run: |
        set -euxo pipefail

        BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}"   
        echo "BASE_URL=$BASE_URL"
        
        # 自动发现最新 rootfs.tar.gz 文件名
        ROOTFS_FILE=$(wget -qO- "${BASE_URL}/" | grep -oE 'openwrt-.*rootfs\.tar\.gz' | head -n1)
        echo "ROOTFS_FILE=$ROOTFS_FILE"
        
        # 下载文件和校验码
        wget "${BASE_URL}/${ROOTFS_FILE}"
        wget "${BASE_URL}/sha256sums"
        
        # 校验成功后，将其重命名为 rootfs.tar.gz
        grep "$(basename "$ROOTFS_FILE")$" sha256sums > sha256sums.rootfs
        sha256sum -c sha256sums.rootfs
        
        mv "$ROOTFS_FILE" rootfs.tar.gz

    - name: 生成 Dockerfile（增强版 OpenWrt Rootfs）
      run: |
        cat > Dockerfile <<'EOF'
        FROM scratch
        ADD rootfs.tar.gz /
        
        VOLUME ["/sys", "/proc", "/tmp"]
        EXPOSE 22 80 443
        STOPSIGNAL SIGTERM
        
        USER root
        ENTRYPOINT ["/sbin/init"]
        EOF

    - name: 配置 QEMU 跨平台构建支持
      uses: docker/setup-qemu-action@v3

    - name: 配置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录 Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 登录 GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 构建并推送 Docker 镜像 (linux/arm/v7)
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/arm/v7
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/openwrt-armv7:v25.12.5
          ghcr.io/${{ github.repository_owner }}/openwrt-armv7:v25.12.5
          
    - name: 上传 Rootfs（供 Armbian 原生 Linux 使用）
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-armv7-luci-rootfs-25.12.5
        path: rootfs.tar.gz
